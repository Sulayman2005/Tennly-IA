<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tennly</title>
    <!-- Logo (17/09/2026) : icône balle de tennis fournie par le CEO,
         remplace l'ancien mark "trajectoire" partout (en-tête public,
         back-office, et ici comme favicon / icône d'accueil iOS). -->
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <!-- Police d'affichage "Anton" (11/09/2026) : réservée à la carte
         résultat d'un match terminé (MatchDetailView.vue, .result-winner/
         .result-eyebrow) pour un vrai effet "titre d'affiche" — jamais
         utilisée ailleurs sur le site, qui reste sur la police système
         (voir tokens.css). Chargée globalement ici plutôt qu'en @import
         dans le composant : une seule requête, mise en cache pour tout le
         site si d'autres écrans en ont besoin plus tard.

         Police mono "JetBrains Mono" (15/09/2026) : réservée à la page
         /fiabilite (ModelReliabilityView.vue), passée en thème sombre
         "technique" — chiffres et libellés de données en monospace pour
         un effet console/terminal, jamais utilisée ailleurs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
